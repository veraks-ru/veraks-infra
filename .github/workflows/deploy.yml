name: Deploy veraks

# Ручной деплой (кнопка «Run workflow»). Опция seed — засеять демо-данные
# (только на первом деплое; seed.py делает TRUNCATE).
on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Засеять демо-данные (seed.py) — ТОЛЬКО первый деплой"
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Namespace + image pull secret
        run: |
          kubectl create namespace veraks --dry-run=client -o yaml | kubectl apply -f -
          # Секрет доступа к Docker Hub (avvolob/* — приватные репозитории) и
          # привязка к default-ServiceAccount неймспейса: все поды тянут образы
          # автоматически, без правки чарта.
          kubectl -n veraks create secret docker-registry veraks-regcred \
            --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKERHUB_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n veraks patch serviceaccount default \
            -p '{"imagePullSecrets":[{"name":"veraks-regcred"}]}'

      # Плавающий :latest дважды поднимал ПРЕДЫДУЩИЙ образ: статус сборки
      # становится success раньше, чем образ дозаливается в реестр. Снимаем
      # digest в момент деплоя — тогда катится ровно то, что лежит в реестре
      # сейчас, а смена digest'а сама пересоздаёт поды.
      - name: Снять digest'ы образов из реестра
        id: digests
        run: |
          echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login \
            -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
          for pair in backend:avvolob/veraks frontend:avvolob/veraks-web mockesia:avvolob/veraks-mock-esia; do
            name="${pair%%:*}"; repo="${pair#*:}"
            d=$(docker manifest inspect "$repo:latest" -v | jq -r '.Descriptor.digest // .[0].Descriptor.digest')
            if [ -z "$d" ] || [ "$d" = "null" ]; then
              echo "Не удалось получить digest для $repo" >&2; exit 1
            fi
            echo "$name=$d" >> "$GITHUB_OUTPUT"
            echo "$repo -> $d"
          done

      - uses: azure/setup-helm@v4

      - name: helm upgrade --install
        run: |
          helm upgrade --install veraks ./helm/veraks \
            --namespace veraks \
            --set seed.enabled=${{ inputs.seed }} \
            --set images.backend.digest="${{ steps.digests.outputs.backend }}" \
            --set images.frontend.digest="${{ steps.digests.outputs.frontend }}" \
            --set images.mockEsia.digest="${{ steps.digests.outputs.mockesia }}" \
            --set secrets.snilsHmacKey="${{ secrets.VERAKS_SNILS_HMAC_KEY }}" \
            --set secrets.fieldEncryptionKey="${{ secrets.VERAKS_FIELD_ENCRYPTION_KEY }}" \
            --set secrets.jwtSecret="${{ secrets.VERAKS_JWT_SECRET }}" \
            --set secrets.postgresPassword="${{ secrets.VERAKS_POSTGRES_PASSWORD }}" \
            --set secrets.appDbPassword="${{ secrets.VERAKS_APP_DB_PASSWORD }}" \
            --set secrets.goctopusPassword="${{ secrets.VERAKS_GOCTOPUS_PASSWORD }}" \
            --set secrets.tbankTerminalKey="${{ secrets.VERAKS_TBANK_TERMINAL_KEY }}" \
            --set secrets.tbankPassword="${{ secrets.VERAKS_TBANK_PASSWORD }}" \
            --set secrets.jumpApiKey="${{ secrets.VERAKS_JUMP_API_KEY }}" \
            --set secrets.mailPassword="${{ secrets.VERAKS_MAIL_PASSWORD }}" \
            --wait --timeout 8m

      - name: Дождаться переката приложений
        # Поды пересоздаёт сам helm: digest в манифесте меняется вместе с
        # образом. Restart оставлен как страховка на случай, когда digest тот
        # же (передеплой без новой сборки), и стоит дёшево.
        # Postgres/Redis (StatefulSet/пиновые теги) не трогаем.
        run: |
          apps="backend worker frontend goctopus mock-esia"
          for d in $apps; do kubectl -n veraks rollout restart deploy/veraks-$d; done
          for d in $apps; do kubectl -n veraks rollout status deploy/veraks-$d --timeout=5m; done
