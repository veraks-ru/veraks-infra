# Значения по умолчанию для демо-контура «Веракс».
# Секреты (пароли, ключи) НЕ хранятся здесь — прокидываются через --set из
# GitHub Actions (secrets.*). Здесь только несекретные дефолты и структура.

images:
  # Собираются GitHub Actions и пушатся в Docker Hub; тег переопределяется деплоем.
  backend:
    repository: avvolob/veraks
    tag: latest
    # Проставляется деплоем из реестра (см. veraks.image в _helpers.tpl):
    # пусто — берётся tag, иначе образ тянется по digest.
    digest: ""
  frontend:
    repository: avvolob/veraks-web
    tag: latest
    # Проставляется деплоем из реестра (см. veraks.image в _helpers.tpl):
    # пусто — берётся tag, иначе образ тянется по digest.
    digest: ""
  # Мок-ЕСИА (dev/mock-esia) — отдельный лёгкий образ для демо.
  mockEsia:
    repository: avvolob/veraks-mock-esia
    tag: latest
    # Проставляется деплоем из реестра (см. veraks.image в _helpers.tpl):
    # пусто — берётся tag, иначе образ тянется по digest.
    digest: ""
  postgres:
    repository: postgres
    tag: "15"
  redis:
    repository: redis
    tag: "7"
  goctopus:
    repository: avvolob/goctopus
    tag: latest
    # Проставляется деплоем из реестра (см. veraks.image в _helpers.tpl):
    # пусто — берётся tag, иначе образ тянется по digest.
    digest: ""

# Образы приложений с тегом :latest — тянем всегда, иначе нода кэширует старый
# слой под тем же тегом и деплой не подхватывает новую сборку (грабли :latest).
imagePullPolicy: Always

# Домены. veraks.ru — фронт, api.veraks.ru — бэкенд, esia.veraks.ru — мок-ЕСИА.
domains:
  app: veraks.ru
  api: api.veraks.ru
  esia: esia.veraks.ru

ingress:
  enabled: true
  className: nginx

tls:
  enabled: true
  # ClusterIssuer `letsencrypt` уже создан aerolist-чартом (cluster-scoped) —
  # НЕ пересоздаём, только ссылаемся аннотацией на Ingress.
  clusterIssuer: letsencrypt
  sslRedirect: true

# Несекретное окружение приложения.
env:
  # Не local: cookie Secure и rate limiting включены; вебхук-секреты обязательны
  # (для мок-демо задаются фиктивными непустыми значениями через секрет).
  appEnv: demo
  # Локальное демо-окно оспаривания = 0ч: в админке «Разрешить → Посчитать»
  # срабатывает сразу (удобно показывать полный цикл).
  disputeWindowHours: "0"
  seasonsAutoFinalize: "true"
  rateLimitPerMinute: "300"
  # Ужесточённый лимит на /auth/* (см. app/middleware/rate_limit.py).
  rateLimitAuthPerMinute: "20"
  # Текущие версии юридических документов (дата редакции текста на /legal).
  # Оператор/юрист меняет их через --set, не пересобирая образ.
  consentsOfferVersion: "2026-07-05"
  consentsPdnVersion: "2026-07-05"
  cookieDomain: ".veraks.ru"
  esiaClientId: veraks-demo
  esiaRequireConfirmed: "true"
  goctopusUser: veraks
  # Провайдеры входа (см. AuthSettings.providers в app/config.py). Сейчас
  # только email — договор с интегратором ЕСИА ещё не заключён; код и мок
  # ЕСИА остаются в чарте (см. mock-esia.yaml), включаются обратно значением
  # "email,esia".
  authProviders: "email"
  # Почта: magic-link вход по email (порт EmailSender, backend/identity).
  # ВНИМАНИЕ: это НЕ fail-fast, как у billing-провайдеров. Без mailHost
  # бэкенд стартует и работает (иначе email — единственный включённый способ
  # входа — уронил бы всю платформу), но письма реально не уходят:
  # LoggingEmailSender пишет письмо целиком (включая ссылку входа) в лог
  # ERROR-уровня — оператор может провести вход/проверку через `kubectl logs`.
  # Заполнить mailHost/секрет пароля реальным SMTP можно в любой момент через
  # helm upgrade --set, без пересборки образа — тогда письма начнут уходить
  # по-настоящему.
  # Яндекс 360: логинимся ящиком организации, а пишем от адреса-синонима на
  # домене veraks.ru — поэтому mailUsername и mailFromAddress РАЗНЫЕ, это не
  # опечатка. Порт 465 = неявный TLS, поэтому starttls выключен.
  mailHost: "smtp.yandex.ru"
  mailPort: "465"
  mailUsername: "info@andreyvolobuev.ru"   # ящик, под которым авторизуемся
  mailFromAddress: "info@veraks.ru"        # синоним, от чьего имени письма
  mailFromName: "Веракс"
  mailUseTls: "true"           # неявный TLS (порт 465)
  mailUseStarttls: "false"     # взаимоисключающе с mailUseTls
  # Явный выбор платёжных провайдеров (fail-fast, см. app/config.py Settings):
  # демо использует эквайринг ТБанк и выплаты Jump.Finance (T8 — раньше не
  # были заданы явно в чарте, хотя tbankEnabled/jumpEnabled уже были включены).
  billingCheckoutProvider: tbank
  billingPayoutProvider: jump
  # Эквайринг ТБанк включён на демо. E-mail для чека 54-ФЗ — временный (ЕСИА
  # почту не даёт; в проде собирать у пользователя).
  tbankEnabled: "true"
  tbankReceiptEmail: avvolob@gmail.com
  # Выплаты Jump.Finance (призовой фонд, СБП). ВНИМАНИЕ: при enabled=true
  # валидатор конфига требует непустой JUMP_API_KEY (секрет VERAKS_JUMP_API_KEY
  # в GitHub) — без него поды не поднимутся (fail-closed).
  jumpEnabled: "true"
  # id юрлица и счёта в Jump (GET /banks_accounts) — несекретные.
  jumpAgentId: "28035"
  jumpBankAccountId: "43691"

# Секреты — ЗАГЛУШКИ. В деплое переопределяются через --set из GitHub Secrets.
# Для мок-демо реальные ЕСИА/платёжные ключи не нужны, но вебхук-секреты должны
# быть непустыми (валидатор конфига требует их вне env=local).
secrets:
  snilsHmacKey: ""            # >= 32 байт
  fieldEncryptionKey: ""      # Fernet key (base64 urlsafe 32 байта)
  jwtSecret: ""               # >= 32 байт
  postgresPassword: ""
  # T9: пароль непривилегированной роли приложения orakul_app (рантайм
  # backend/worker; владелец veraks — только для миграций, см. backend.yaml
  # initContainer'ы bootstrap-app-role/migrate и backend/README.md).
  appDbPassword: ""
  goctopusPassword: ""
  tbankTerminalKey: ""        # эквайринг ТБанк (тестовый DEMO-терминал)
  tbankPassword: ""           # пароль терминала ТБанк
  jumpApiKey: ""              # Client-Key выплат Jump.Finance (из ЛК Jump)
  mailPassword: ""            # пароль SMTP (пусто, если провайдер работает без авторизации)

# Первичное наполнение демо-данными (seed.py). Включать ТОЛЬКО на первом деплое
# (seed делает TRUNCATE — на апгрейдах сбросил бы данные). По умолчанию выкл.
seed:
  enabled: false

postgres:
  # Долговечное хранилище: PVC от local-path-provisioner (hostPath на ноде,
  # /opt/local-path-provisioner) — данные переживают перезапуски пода и ноды.
  # Демо без провижнера: persistence: false → эфемерный emptyDir (seed заполнит БД).
  persistence: true
  storage: 5Gi
  storageClassName: "local-path"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }

redis:
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "250m", memory: "128Mi" }

backend:
  replicas: 1
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits: { cpu: "1", memory: "512Mi" }

worker:
  replicas: 1
  resources:
    requests: { cpu: "50m", memory: "192Mi" }
    limits: { cpu: "500m", memory: "384Mi" }

frontend:
  replicas: 1
  resources:
    requests: { cpu: "50m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

goctopus:
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "250m", memory: "128Mi" }

mockEsia:
  resources:
    requests: { cpu: "25m", memory: "64Mi" }
    limits: { cpu: "250m", memory: "128Mi" }
