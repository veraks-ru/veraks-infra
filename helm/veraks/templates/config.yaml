apiVersion: v1
kind: ConfigMap
metadata:
  name: veraks-config
  labels:
    {{- include "veraks.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.env.appEnv | quote }}
  APP_DEBUG: "false"
  REDIS_URL: "redis://veraks-redis:6379/0"
  # CORS: фронт на app-домене шлёт запросы к api-домену с credentials (cookie).
  CORS_ALLOW_ORIGINS: "https://{{ .Values.domains.app }}"
  # Cookie: Secure (публичный HTTPS) + общий домен .veraks.ru, чтобы сессия
  # ходила между veraks.ru и api.veraks.ru.
  SECURITY_COOKIE_SECURE: "true"
  SECURITY_COOKIE_DOMAIN: {{ .Values.env.cookieDomain | quote }}
  RESOLUTIONS_DISPUTE_WINDOW_HOURS: {{ .Values.env.disputeWindowHours | quote }}
  SEASONS_AUTO_FINALIZE: {{ .Values.env.seasonsAutoFinalize | quote }}
  RATE_LIMIT_PER_MINUTE: {{ .Values.env.rateLimitPerMinute | quote }}
  # Отдельный жёсткий лимит на /auth/* (брутфорс state/токенов), fail-closed.
  RATE_LIMIT_AUTH_PER_MINUTE: {{ .Values.env.rateLimitAuthPerMinute | quote }}
  # Версии обязательных документов (оферта, согласие на ПДн). Меняет юрист —
  # helm upgrade --set env.consentsOfferVersion=..., без пересборки образа:
  # у принявших старую версию сразу появляется недостающее согласие, а
  # участие в конкурсе блокируется до переподтверждения (152-ФЗ, PRD §7).
  CONSENTS_OFFER_VERSION: {{ .Values.env.consentsOfferVersion | quote }}
  CONSENTS_PDN_VERSION: {{ .Values.env.consentsPdnVersion | quote }}
  # ЕСИА (демо через мок). authorize — публичный (браузер редиректится туда);
  # token/userinfo — внутренний сервис (server-to-server).
  ESIA_CLIENT_ID: {{ .Values.env.esiaClientId | quote }}
  ESIA_REDIRECT_URI: "https://{{ .Values.domains.app }}/auth/esia/callback"
  ESIA_AUTHORIZATION_ENDPOINT: "https://{{ .Values.domains.esia }}/authorize"
  ESIA_TOKEN_ENDPOINT: "http://veraks-mock-esia:9000/token"
  ESIA_USERINFO_ENDPOINT: "http://veraks-mock-esia:9000/userinfo"
  ESIA_REQUIRE_CONFIRMED: {{ .Values.env.esiaRequireConfirmed | quote }}
  # Проверка id_token (подпись по JWKS + iss/aud/exp/nonce). Вне APP_ENV=local
  # обе переменные обязательны — пустой ESIA_JWKS_URL валит старт бэкенда.
  # ISSUER — строка внутри маркера (совпадает с MOCK_ESIA_ISSUER мока),
  # JWKS_URL — внутренний адрес сервиса (server-to-server).
  ESIA_ISSUER: "https://{{ .Values.domains.esia }}"
  ESIA_JWKS_URL: "http://veraks-mock-esia:9000/jwks"
  # Реал-тайм уведомления: бэкенд пушит на внутренний адрес goctopus.
  GOCTOPUS_URL: "http://veraks-goctopus:7890"
  GOCTOPUS_USER: {{ .Values.env.goctopusUser | quote }}
  # Провайдеры входа: пока только email — ЕСИА выключена флагом (нет
  # договора с интегратором), включается обратно значением "email,esia".
  AUTH_PROVIDERS: {{ .Values.env.authProviders | quote }}
  # Почта: magic-link вход по email. MAIL_LINK_BASE_URL выводится из домена
  # фронта (ссылка в письме должна вести на витрину, а не на API) — не хардкодить.
  MAIL_HOST: {{ .Values.env.mailHost | quote }}
  MAIL_PORT: {{ .Values.env.mailPort | quote }}
  MAIL_USERNAME: {{ .Values.env.mailUsername | quote }}
  MAIL_FROM_ADDRESS: {{ .Values.env.mailFromAddress | quote }}
  MAIL_FROM_NAME: {{ .Values.env.mailFromName | quote }}
  MAIL_USE_TLS: {{ .Values.env.mailUseTls | quote }}
  MAIL_USE_STARTTLS: {{ .Values.env.mailUseStarttls | quote }}
  MAIL_LINK_BASE_URL: "https://{{ .Values.domains.app }}"
  # Явный выбор платёжных провайдеров (T8 — раньше не были заданы явно,
  # хотя tbank/jump ниже уже были включены; см. app/config.py fail-fast).
  BILLING_CHECKOUT_PROVIDER: {{ .Values.env.billingCheckoutProvider | quote }}
  BILLING_PAYOUT_PROVIDER: {{ .Values.env.billingPayoutProvider | quote }}
  # Эквайринг ТБанк (приём платежей за подписку). Terminal Key/пароль — в секрете.
  TBANK_ENABLED: {{ .Values.env.tbankEnabled | quote }}
  TBANK_API_BASE_URL: "https://securepay.tinkoff.ru/v2"
  TBANK_TAXATION: "usn_income"
  TBANK_RECEIPT_EMAIL: {{ .Values.env.tbankReceiptEmail | quote }}
  # Выплаты Jump.Finance (призовой фонд, СБП по телефону). Ключ — в секрете.
  JUMP_ENABLED: {{ .Values.env.jumpEnabled | quote }}
  JUMP_API_BASE_URL: "https://api.jump.finance/services/openapi"
  JUMP_AGENT_ID: {{ .Values.env.jumpAgentId | quote }}
  JUMP_BANK_ACCOUNT_ID: {{ .Values.env.jumpBankAccountId | quote }}
  # Публичные базы: SuccessURL/FailURL (фронт) и NotificationURL вебхука (api).
  PUBLIC_WEB_BASE: "https://{{ .Values.domains.app }}"
  PUBLIC_API_BASE: "https://{{ .Values.domains.api }}"
