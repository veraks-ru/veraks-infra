{{- if .Values.seed.enabled }}
# Первичное наполнение демо-данными. POST-install/upgrade хук: к этому моменту
# обычные ресурсы (Secret/ConfigMap) уже созданы, а схема БД мигрирована
# initContainer'ом бэкенда (helm --wait дождался готовности бэкенда). seed.py
# делает TRUNCATE — поэтому включается только на первом деплое (seed.enabled).
apiVersion: batch/v1
kind: Job
metadata:
  name: veraks-seed-{{ .Release.Revision }}
  labels:
    {{- include "veraks.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "veraks.labels" . | nindent 8 }}
        veraks/component: seed
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: {{ include "veraks.image" .Values.images.backend }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["python", "seed.py"]
          # T9: seed.py делает TRUNCATE — привилегии на это нет у роли
          # приложения (нарочно, чтобы рантайм не мог); используем владельца.
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: veraks-secrets
                  key: MIGRATIONS_DATABASE_URL
          envFrom:
            - configMapRef:
                name: veraks-config
            - secretRef:
                name: veraks-secrets
{{- end }}
