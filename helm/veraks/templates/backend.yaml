apiVersion: v1
kind: Service
metadata:
  name: veraks-backend
  labels:
    {{- include "veraks.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: veraks
    veraks/component: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: veraks-backend
  labels:
    {{- include "veraks.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: veraks
      veraks/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veraks
        veraks/component: backend
    spec:
      initContainers:
        # T9: роль приложения orakul_app должна существовать ДО миграций —
        # иначе REVOKE UPDATE/DELETE на append-only из 0011/0029 будет no-op
        # (роль появится позже, но задним числом привилегии не подтянутся).
        # Владелец схемы (MIGRATIONS_DATABASE_URL) — единственный, кто может
        # GRANT/REVOKE/ALTER DEFAULT PRIVILEGES. Идемпотентно, безопасно на
        # каждом старте (1 реплика).
        - name: bootstrap-app-role-pre
          image: {{ include "veraks.image" .Values.images.backend }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - sh
            - -c
            - |
              until python -c "import asyncio,asyncpg,os,urllib.parse as u; \
                p=u.urlparse(os.environ['DATABASE_URL'].replace('+asyncpg','')); \
                asyncio.run(asyncpg.connect(host=p.hostname,port=p.port or 5432,user=p.username,password=p.password,database=p.path[1:]))" 2>/dev/null; do
                echo "ожидаю Postgres..."; sleep 2;
              done
              python scripts/create_app_role.py
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: veraks-secrets
                  key: MIGRATIONS_DATABASE_URL
          envFrom:
            - secretRef:
                name: veraks-secrets
        # Применяем миграции владельцем схемы ДО старта бэкенда (сам бэкенд
        # ходит непривилегированной ролью — DATABASE_URL из envFrom ниже).
        - name: migrate
          image: {{ include "veraks.image" .Values.images.backend }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: veraks-secrets
                  key: MIGRATIONS_DATABASE_URL
          envFrom:
            - configMapRef:
                name: veraks-config
            - secretRef:
                name: veraks-secrets
        # Перевыдаём гранты ПОСЛЕ миграций: свежесозданные владельцем таблицы
        # уже получили CRUD через ALTER DEFAULT PRIVILEGES (см. create_app_role.py
        # шаг 5), но актуальный список append-only здесь — источник истины;
        # перезапуск нужен, если он расширился со времени последнего деплоя.
        - name: bootstrap-app-role-post
          image: {{ include "veraks.image" .Values.images.backend }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["python", "scripts/create_app_role.py"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: veraks-secrets
                  key: MIGRATIONS_DATABASE_URL
          envFrom:
            - secretRef:
                name: veraks-secrets
      containers:
        - name: backend
          image: {{ include "veraks.image" .Values.images.backend }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef:
                name: veraks-config
            - secretRef:
                name: veraks-secrets
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
